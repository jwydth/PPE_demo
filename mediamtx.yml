logLevel: info
readTimeout: 10s
writeTimeout: 10s
writeQueueSize: 2048

rtsp: true
rtspAddress: :8554
rtspTransports: [tcp]

hls: true
hlsAddress: :8888
hlsEncryption: false
hlsAllowOrigins: ["*"]
hlsAlwaysRemux: true
hlsVariant: lowLatency
hlsSegmentCount: 7
hlsSegmentDuration: 1s
hlsPartDuration: 200ms
hlsSegmentMaxSize: 50M

webrtc: false
rtmp: false
srt: false

pathDefaults:
  source: publisher
  sourceOnDemand: false
  useAbsoluteTimestamp: false

paths:
  all_others:
